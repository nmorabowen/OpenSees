# WP-166: tag-triggered Linux release. Pushing a tag `ladruno-v*` builds the same
# Linux target as Zone-A and creates a GitHub Release carrying
# ladruno-opensees-linux-<tag>.tar.gz (opensees.so + BUILD_INFO.txt + LICENSE).
# The Windows installer is attached later, locally, by
# Ladruno_scripts/publish_installer.ps1. Tags are created by the maintainer only.
#
# MKL (apeGmsh #2571, maintainer ruling 2026-10-27): the Linux build carries
# FEAST (`eigen -feast`) and PARDISO (`system Pardiso`) through the two Linux
# opt-ins the mkl-compat job in ladruno.yml configures, linked DYNAMICALLY
# against the oneMKL PyPI wheels. No Intel runtime file is shipped: the tarball
# holds no libmkl*, and the step that packs it fails if one gets in. At run time
# opensees.so needs `pip install "mkl>=2024.2.2,<2026"` (MKL_RUNTIME_SPEC) in
# the same environment. Its RUNPATH is
# $ORIGIN/../.., which is the environment's lib/ dir (where the mkl wheel puts
# libmkl_*.so.2) when opensees.so sits in that environment's site-packages, the
# way apeGmsh's live-fork lane installs it. Anywhere else, put the dir holding
# libmkl_*.so.2 on LD_LIBRARY_PATH. Without MKL `import opensees` fails, naming
# the missing libmkl_*.so.2.
#
# Dry run: a pull request that edits this file, or a manual dispatch, runs the
# same build, package checks and MKL smokes, and uploads the tarball as a
# workflow artifact. Only a `ladruno-v*` tag push creates a Release.
name: Ladruno Release

on:
  push:
    tags: ["ladruno-v*"]
  pull_request:
    branches: [ladruno]
    paths: [".github/workflows/ladruno_release.yml"]
  workflow_dispatch:

permissions:
  contents: write

# An explicit `shell: bash` runs every step with -o pipefail, so a failing
# command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  linux-release:
    name: Linux tarball release
    if: github.repository == 'nmorabowen/OpenSees'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # The OLDEST oneMKL the fork supports (mkl-compat, WP-148). Linking against
      # it keeps the binary loadable by a later mkl wheel only while the wheel
      # still ships the libmkl_*.so.2 SONAME: the 2026.x wheels do not (found
      # by this workflow's smoke), so the runtime requirement is capped.
      MKL_BUILD_VERSION: "2024.2.2"
      MKL_RUNTIME_SPEC: "mkl>=2024.2.2,<2026"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "REL_NAME=ladruno-opensees-linux-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "REL_NAME=ladruno-opensees-linux-dryrun-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zone-a-${{ runner.os }}
          max-size: 2G
      - name: Install conan
        run: |
          pip install conan numpy
          conan profile detect --force
      # As in mkl-compat (ladruno.yml): the wheels are unpacked into a private
      # tree, NOT pip-installed, so the root find_package(MKL) cannot find the
      # mkl-devel MKLConfig.cmake and move the configure off the Linux opt-in
      # path. Wheels carry no symlinks, so the unversioned names find_library()
      # wants are made here; the SONAME stays libmkl_*.so.2.
      - name: oneMKL headers + libraries (PyPI wheels, private tree)
        run: |
          pip download --no-deps --only-binary=:all: -d "$RUNNER_TEMP/whl" "mkl==$MKL_BUILD_VERSION" "mkl-include==$MKL_BUILD_VERSION"
          MKL="$RUNNER_TEMP/mkl-build"
          mkdir -p "$MKL/lib" "$MKL/include"
          for w in "$RUNNER_TEMP"/whl/*.whl; do python -m zipfile -e "$w" "$RUNNER_TEMP/x"; done
          mv "$RUNNER_TEMP"/x/mkl-*.data/data/lib/* "$MKL/lib/"
          mv "$RUNNER_TEMP"/x/mkl_include-*.data/data/include/* "$MKL/include/"
          (cd "$MKL/lib" && for f in libmkl_*.so.2; do ln -s "$f" "${f%.2}"; done)
          grep "define INTEL_MKL_VERSION" "$MKL/include/mkl_version.h"
          echo "LADRUNO_MKL_BUILD=$MKL" >> "$GITHUB_ENV"
      # The Zone-A build plus the two Linux MKL opt-ins. The build tree uses the
      # install RPATH ($ORIGIN/../..), so the private MKL tree's path is never
      # baked into the binaries; the RUNPATH check below holds that.
      - name: Build OpenSees + OpenSeesPy (FEAST + PARDISO, dynamic MKL)
        run: |
          conan install . --build=missing
          cmake -S . -B build/Release -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLADRUNO_MKL_FEAST_LINUX=ON -DLADRUNO_MKL_PARDISO_LINUX=ON -DMKL_RT_HINT="$LADRUNO_MKL_BUILD/lib" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON '-DCMAKE_INSTALL_RPATH=$ORIGIN/../..' | tee "$RUNNER_TEMP/configure.log"
          grep -q "Ladruno: MKL FEAST on Linux ENABLED" "$RUNNER_TEMP/configure.log"
          grep -q "Ladruno: MKL PARDISO on Linux ENABLED (sequential" "$RUNNER_TEMP/configure.log"
          cd build/Release
          cmake --build . --target OpenSees -j8
          cmake --build . --target OpenSeesPy -j8
          mv OpenSeesPy.so opensees.so
      - name: opensees.so links MKL dynamically, RUNPATH is $ORIGIN/../..
        run: |
          so=build/Release/opensees.so
          readelf -d "$so" | tee "$RUNNER_TEMP/dyn.txt"
          for lib in libmkl_intel_lp64.so.2 libmkl_sequential.so.2 libmkl_core.so.2; do
            grep -qE "\(NEEDED\).*\[$lib\]" "$RUNNER_TEMP/dyn.txt" || { echo "::error::opensees.so does not NEED $lib"; exit 1; }
          done
          rp=$(grep -E '\((RUNPATH|RPATH)\)' "$RUNNER_TEMP/dyn.txt" | sed -E 's/.*\[(.*)\]$/\1/')
          [ "$rp" = '$ORIGIN/../..' ] || { echo "::error::opensees.so RUNPATH is '$rp', want '\$ORIGIN/../..'"; exit 1; }
          # FEAST and PARDISO come from MKL at load time, not from a static copy.
          nm -D --undefined-only "$so" > "$RUNNER_TEMP/und.txt"
          for sym in dfeast_scsrgv pardiso; do
            grep -E " U ${sym}_?$" "$RUNNER_TEMP/und.txt" || { echo "::error::$sym is not imported from MKL"; exit 1; }
          done
      - name: Package tarball (no MKL runtime inside)
        run: |
          export TCL_LIBRARY="$(dirname "$(find ~/.conan2 -name init.tcl -path '*/tcl8.6/*' | head -1)")"
          LD_LIBRARY_PATH="$LADRUNO_MKL_BUILD/lib" bash Ladruno_scripts/make_linux_build_info.sh build/Release build/Release/BUILD_INFO.txt
          {
            echo "--- MKL ---"
            echo "mkl: FEAST + PARDISO, linked dynamically against oneMKL $MKL_BUILD_VERSION (PyPI wheels); no MKL library is shipped"
            echo "mkl_runtime: pip install \"$MKL_RUNTIME_SPEC\" in the environment that imports opensees (2026.x wheels lack libmkl_*.so.2)"
            echo "mkl_runpath: \$ORIGIN/../.. (= <env>/lib when opensees.so is in <env>'s site-packages); else set LD_LIBRARY_PATH"
          } >> build/Release/BUILD_INFO.txt
          mkdir "$REL_NAME"
          cp build/Release/opensees.so build/Release/BUILD_INFO.txt "$REL_NAME/"
          cp COPYRIGHT "$REL_NAME/LICENSE"
          tar czf "$REL_NAME.tar.gz" "$REL_NAME"
          ls -l "$REL_NAME.tar.gz"
          tar tzf "$REL_NAME.tar.gz" | sort | tee "$RUNNER_TEMP/listing.txt"
          printf '%s\n' "$REL_NAME/" "$REL_NAME/BUILD_INFO.txt" "$REL_NAME/LICENSE" "$REL_NAME/opensees.so" | sort > "$RUNNER_TEMP/want.txt"
          diff "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/listing.txt" || { echo "::error::tarball holds files other than opensees.so, BUILD_INFO.txt and LICENSE"; exit 1; }
          if grep -iE 'libmkl|iomp|tbb' "$RUNNER_TEMP/listing.txt"; then echo "::error::an Intel runtime file is in the tarball"; exit 1; fi
          echo "tarball: no libmkl* (checked)"
      # From here on the build-time MKL tree is gone and LD_LIBRARY_PATH is
      # unset, so the smokes can only find MKL where `pip install mkl` put it.
      - name: Remove the build-time MKL tree
        run: rm -rf "$LADRUNO_MKL_BUILD" "$RUNNER_TEMP/whl" "$RUNNER_TEMP/x"
      - name: Smoke the shipped opensees.so (FEAST + PARDISO, pip mkl)
        env:
          LADRUNO_OPENSEES_QUIET: "1"
        run: |
          unset LD_LIBRARY_PATH
          mkdir "$RUNNER_TEMP/pkg"
          tar xzf "$REL_NAME.tar.gz" -C "$RUNNER_TEMP/pkg" --strip-components=1
          cat > "$RUNNER_TEMP/smoke.py" <<'PY'
          import math
          import opensees as ops

          # PARDISO: Euler-Bernoulli cantilever, tip load. elasticBeamColumn is
          # exact at the nodes, so the tip deflection is P L^3 / (3 E I).
          L, n, E, A, Iz, P = 4.0, 8, 2.0e11, 1.0e-2, 8.0e-6, 1.0e3
          ops.wipe()
          ops.model("basic", "-ndm", 2, "-ndf", 3)
          for i in range(n + 1):
              ops.node(i + 1, i * L / n, 0.0)
          ops.fix(1, 1, 1, 1)
          ops.geomTransf("Linear", 1)
          for i in range(1, n + 1):
              ops.element("elasticBeamColumn", i, i, i + 1, A, E, Iz, 1)
          ops.timeSeries("Linear", 1)
          ops.pattern("Plain", 1, 1)
          ops.load(n + 1, 0.0, P, 0.0)
          ops.constraints("Plain")
          ops.numberer("RCM")
          ops.system("Pardiso")
          ops.algorithm("Linear")
          ops.integrator("LoadControl", 1.0)
          ops.analysis("Static")
          assert ops.analyze(1) == 0, "Pardiso analyze failed"
          u, ref = ops.nodeDisp(n + 1, 2), P * L**3 / (3.0 * E * Iz)
          assert abs(u - ref) <= 1e-9 * abs(ref), (u, ref)
          print(f"pardiso tip {u:.12e} closed form {ref:.12e}")

          # FEAST vs ARPACK on a 2-bay, 3-storey frame: the same eigenvalues, and
          # exactly the modes below the band edge (midway between modes 3 and 4;
          # modes 4-6 are a near-degenerate cluster at ~30 Hz).
          ops.wipe()
          ops.model("basic", "-ndm", 2, "-ndf", 3)
          nx, ny, m = 2, 3, 5.0e3
          for j in range(ny + 1):
              for i in range(nx + 1):
                  t = j * (nx + 1) + i + 1
                  ops.node(t, i * 5.0, j * 3.0)
                  if j == 0:
                      ops.fix(t, 1, 1, 1)
                  else:
                      ops.mass(t, m, m, 0.0)
          ops.geomTransf("Linear", 1)

          def nid(i, j):
              return j * (nx + 1) + i + 1

          e = 0
          for j in range(1, ny + 1):
              for i in range(nx + 1):
                  e += 1
                  ops.element("elasticBeamColumn", e, nid(i, j - 1), nid(i, j), 0.09, 30.0e9, 6.75e-4, 1)
              for i in range(nx):
                  e += 1
                  ops.element("elasticBeamColumn", e, nid(i, j), nid(i + 1, j), 0.09, 30.0e9, 6.75e-4, 1)
          lam_ref = ops.eigen(6)
          f = [math.sqrt(x) / (2.0 * math.pi) for x in lam_ref]
          assert f[3] > 1.05 * f[2], f
          lam = ops.eigen("-feast", 0.0, 0.5 * (f[2] + f[3]))
          assert len(lam) == 3, (lam, lam_ref)
          for a, b in zip(lam, lam_ref[:3]):
              assert abs(a - b) <= 1e-6 * b, (lam, lam_ref)  # the fork's G-B gate
          print("feast", [f"{x:.10e}" for x in lam], "arpack", [f"{x:.10e}" for x in lam_ref[:3]])
          print("LADRUNO_MKL_SMOKE_OK")
          PY
          i=0
          # Both ends of MKL_RUNTIME_SPEC: the build version and the newest
          # wheel the spec admits.
          for spec in "mkl==$MKL_BUILD_VERSION" "$MKL_RUNTIME_SPEC"; do
            i=$((i+1)); v="$RUNNER_TEMP/venv$i"
            python -m venv "$v"
            "$v/bin/pip" install -q numpy "$spec"
            "$v/bin/pip" show mkl | grep -E '^(Name|Version):'
            purelib=$("$v/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
            cp "$RUNNER_TEMP/pkg/opensees.so" "$purelib/"
            ldd "$purelib/opensees.so" | tee "$RUNNER_TEMP/ldd$i.txt"
            # libpython is NEEDED but comes from the importing interpreter (as
            # before this change); every other library must resolve.
            if grep "not found" "$RUNNER_TEMP/ldd$i.txt" | grep -vE '^\s*libpython3\.11\.so\.1\.0 => not found$'; then echo "::error::unresolved library ($spec)"; exit 1; fi
            for lib in libmkl_intel_lp64.so.2 libmkl_sequential.so.2 libmkl_core.so.2; do
              grep -qE "^\s*$lib => $v/lib/python3\.11/site-packages/\.\./\.\./$lib |^\s*$lib => $v/lib/$lib " "$RUNNER_TEMP/ldd$i.txt" || { echo "::error::$lib not resolved from $v/lib ($spec)"; exit 1; }
            done
            (cd "$RUNNER_TEMP" && "$v/bin/python" smoke.py) > "$RUNNER_TEMP/smoke$i.log" 2>&1 || { cat "$RUNNER_TEMP/smoke$i.log"; echo "::error::smoke failed ($spec)"; exit 1; }
            cat "$RUNNER_TEMP/smoke$i.log"
            grep -qx "LADRUNO_MKL_SMOKE_OK" "$RUNNER_TEMP/smoke$i.log" || { echo "::error::no smoke marker ($spec)"; exit 1; }
            if grep -E "WARNING|FEAST requires" "$RUNNER_TEMP/smoke$i.log"; then echo "::error::engine warning in smoke ($spec)"; exit 1; fi
          done
          echo "LADRUNO_MKL_VENV=$RUNNER_TEMP/venv2" >> "$GITHUB_ENV"
      # Not a gate: what the newest, uncapped wheel ships, so a later SONAME
      # change is visible in the log when the cap is revisited.
      - name: Newest mkl wheel (information only)
        run: |
          v="$RUNNER_TEMP/venv-newest"
          python -m venv "$v"
          "$v/bin/pip" install -q mkl
          "$v/bin/pip" show mkl | grep -E '^(Name|Version):'
          ls "$v/lib" | grep -E '^libmkl_(intel_lp64|sequential|core)\.so' || true
      # The dependency is real: without the mkl wheel the import fails and names
      # the missing MKL library (nothing bundled, no silent fallback).
      - name: Without pip mkl, import opensees fails naming libmkl
        run: |
          unset LD_LIBRARY_PATH
          v="$RUNNER_TEMP/venv-nomkl"
          python -m venv "$v"
          "$v/bin/pip" install -q numpy
          purelib=$("$v/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp "$RUNNER_TEMP/pkg/opensees.so" "$purelib/"
          if (cd "$RUNNER_TEMP" && "$v/bin/python" -c "import opensees") > "$RUNNER_TEMP/nomkl.log" 2>&1; then
            cat "$RUNNER_TEMP/nomkl.log"; echo "::error::opensees imported without MKL installed"; exit 1
          fi
          cat "$RUNNER_TEMP/nomkl.log"
          grep -q "libmkl_.*\.so\.2: cannot open shared object file" "$RUNNER_TEMP/nomkl.log"
      # The same two checks through the classic Tcl interpreter (not shipped).
      # OpenSees.exe exits 0 on a Tcl error, so only the trailing marker counts.
      - name: Smoke the Tcl interpreter (eigen -feast, system Pardiso)
        run: |
          export TCL_LIBRARY="$(dirname "$(find ~/.conan2 -name init.tcl -path '*/tcl8.6/*' | head -1)")"
          cat > "$RUNNER_TEMP/smoke.tcl" <<'TCL'
          wipe
          model basic -ndm 2 -ndf 3
          set L 4.0; set n 8; set E 2.0e11; set A 1.0e-2; set Iz 8.0e-6; set P 1.0e3
          for {set i 0} {$i <= $n} {incr i} { node [expr {$i+1}] [expr {$i*$L/$n}] 0.0 }
          fix 1 1 1 1
          for {set i 2} {$i <= $n+1} {incr i} { mass $i 10.0 10.0 0.0 }
          geomTransf Linear 1
          for {set i 1} {$i <= $n} {incr i} { element elasticBeamColumn $i $i [expr {$i+1}] $A $E $Iz 1 }
          timeSeries Linear 1
          pattern Plain 1 1 { load [expr {$n+1}] 0.0 $P 0.0 }
          constraints Plain; numberer RCM; system Pardiso
          algorithm Linear; integrator LoadControl 1.0; analysis Static
          if {[analyze 1] != 0} { error "Pardiso analyze failed" }
          set u [nodeDisp [expr {$n+1}] 2]
          set ref [expr {$P*pow($L,3)/(3.0*$E*$Iz)}]
          if {abs($u-$ref) > 1e-9*abs($ref)} { error "Pardiso tip $u != $ref" }
          puts "pardiso tip $u closed form $ref"
          wipeAnalysis
          set ref [eigen 4]
          set twoPi [expr {8.0*atan(1.0)}]
          set f3 [expr {sqrt([lindex $ref 2])/$twoPi}]
          set f4 [expr {sqrt([lindex $ref 3])/$twoPi}]
          if {$f4 <= 1.05*$f3} { error "modes 3 and 4 too close: $ref" }
          set lam [eigen -feast 0.0 [expr {0.5*($f3+$f4)}]]
          if {[llength $lam] != 3} { error "FEAST found [llength $lam] modes: $lam vs $ref" }
          foreach a $lam b [lrange $ref 0 2] { if {abs($a-$b) > 1e-6*$b} { error "FEAST $lam != ARPACK $ref" } }
          puts "feast $lam arpack [lrange $ref 0 2]"
          puts LADRUNO_MKL_TCL_SMOKE_OK
          TCL
          LD_LIBRARY_PATH="$LADRUNO_MKL_VENV/lib" build/Release/OpenSees "$RUNNER_TEMP/smoke.tcl" > "$RUNNER_TEMP/smoke_tcl.log" 2>&1 || true
          cat "$RUNNER_TEMP/smoke_tcl.log"
          grep -qx "LADRUNO_MKL_TCL_SMOKE_OK" "$RUNNER_TEMP/smoke_tcl.log" || { echo "::error::Tcl smoke marker missing"; exit 1; }
      - name: Upload the dry-run tarball
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REL_NAME }}
          path: ${{ env.REL_NAME }}.tar.gz
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'ladruno-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$REL_NAME.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Linux opensees.so (see BUILD_INFO.txt in the tarball), with MKL FEAST and PARDISO linked dynamically: run \`pip install \"$MKL_RUNTIME_SPEC\"\` in the environment that imports it (no MKL library is shipped). The Windows installer is attached separately via Ladruno_scripts/publish_installer.ps1."
