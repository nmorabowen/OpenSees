# Ladruno WP-179 -- the Windows gates, ON DEMAND ONLY.
#
#   gh workflow run ladruno_windows.yml --ref <branch>            # platform tests
#   gh workflow run ladruno_windows.yml --ref <branch> -f scope=zone_a -f slow=true
#
# Why it exists: Zone-A is Ubuntu without MKL, so every test that branches on
# the platform (Pardiso, FEAST, the MSVC byte-identity baselines, the boot-.pth
# wiring) ran in NO CI since the self-hosted tier lost its runner (~2026-06-20,
# issue #934). The ADR-97 gate-4 drift (WP-175) stayed invisible for weeks.
#
# On demand by the owner's choice: the runner is a developer desktop, so nothing
# here runs on a schedule or on PR events, and it is NOT a required check.
# Its label is `ladruno-win`, NOT `ladruno-perf`, on purpose: registering the
# desktop with only `ladruno-win` leaves the nightly self-hosted jobs in
# ladruno.yml dormant. Runner setup: Ladruno_internal/WINDOWS_RUNNER.md.
#
# Provenance, end to end (each link closed a failure seen in WP-175..178):
#   1. CMakeLists.txt is touched, so CMake RECONFIGURES and re-stamps
#      ladrunoBuild() with this commit (BUILD_GOTCHAS "ladrunoBuild lags").
#   2. build.bat builds all 5 targets and byte-verifies dist\ against the build,
#      failing on a locked or stale copy (WP-178).
#   3. ci_run_pytest.py runs under `python -S`, pins dist\bin, and requires
#      ladrunoBuild() == github.sha (WP-176/179).
name: Ladruno Windows gates (on demand)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "platform = files with a win32 leg (from the quirk lint); zone_a; all"
        type: choice
        options: [platform, zone_a, all]
        default: platform
      slow:
        description: "also run the slow tier (LADRUNO_RUN_SLOW=1)"
        type: boolean
        default: false

# One build at a time on the desktop; a second dispatch queues behind the first.
concurrency:
  group: ladruno-windows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-gates:
    name: Windows gates (self-hosted, ${{ inputs.scope }})
    if: github.repository == 'nmorabowen/OpenSees'
    runs-on: [self-hosted, windows, ladruno-win]
    timeout-minutes: 240
    steps:
      # clean: false keeps build\ between runs (incremental, minutes instead of
      # ~40). Steps 1-3 above are what make a reused tree trustworthy.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Force a CMake reconfigure (re-stamp ladrunoBuild)
        shell: pwsh
        run: (Get-Item CMakeLists.txt).LastWriteTime = Get-Date

      - name: Build all targets (build.bat, byte-verified dist)
        shell: cmd
        run: call Ladruno_scripts\setup_env.bat && call Ladruno_scripts\build.bat

      - name: Run the Windows gates
        shell: pwsh
        env:
          LADRUNO_RUN_SLOW: ${{ inputs.slow && '1' || '' }}
          APEGMSH_SKIP_VIEWER: "1"
        run: |
          $sel = switch ("${{ inputs.scope }}") {
            "platform" { @(py -3.12 ci/check_quirk_patterns.py --list-platform-tests) }
            "zone_a"   { @("-m", "zone_a") }
            "all"      { @() }
          }
          if ("${{ inputs.scope }}" -eq "platform" -and $sel.Count -eq 0) {
            Write-Host "::error::--list-platform-tests returned nothing; refusing to report a green run of zero tests."
            exit 1
          }
          Write-Host "selection: $($sel -join ' ')"
          py -3.12 -S Ladruno_scripts/ci_run_pytest.py --expect-sha "${{ github.sha }}" -- `
            -v -rfEs --junitxml=../windows-gates-junit.xml @sel
          exit $LASTEXITCODE

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gates-junit-${{ inputs.scope }}
          path: windows-gates-junit.xml
          if-no-files-found: ignore
