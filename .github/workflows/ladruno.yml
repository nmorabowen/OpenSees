# Ladruno fork CI — Zone-A gate. Does NOT run on upstream (guarded by repo name)
# so a PR back to OpenSees/OpenSees never drags this workflow along.
# Upstream build_cmake.yml stays untouched and keeps gating master.
name: Ladruno Zone-A

on:
  push:
    branches: [ladruno]
  pull_request:
    branches: [ladruno]
    # include ready_for_review so marking a draft "ready" re-triggers the build
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * *"   # nightly Zone-B / perf (self-hosted)
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch/PR, so
# rapid pushes don't queue 40-min builds behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- static gates: no build needed, fast, always run -------------------
  static-gates:
    name: classTag + manifest gates
    if: github.repository == 'nmorabowen/OpenSees'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: classTag collision + drift (Axis 1, G2)
        run: python ci/check_classtags.py
      - name: manifest ledger (G9)
        run: python ci/check_manifest.py
      # MPCO_Ladruno schema-v1 gate (D5): the validator is the executable spec and
      # the round-trip oracle reconstructs x(GP_PARAM) vs GLOBAL_GP_COORDS at write
      # time -- both run pure-Python on a synthetic fixture, no OpenSees build, so
      # they gate every PR (incl. drafts) in seconds.
      - name: MPCO_Ladruno validator + round-trip oracle (D5)
        run: |
          pip install h5py numpy pytest
          cd Ladruno_scripts/ladruno_recorder_tests
          pytest -q test_ladruno_harness.py

  # ---- Zone-A: build + pytest(zone_a) + gated Tcl suite ------------------
  zone-a-ubuntu:
    name: Zone-A (Ubuntu)
    # Skip the ~40-min Conan build on DRAFT PRs (drafts keep only the fast
    # static-gates). Still runs on push to ladruno, the nightly schedule, and
    # when a PR is taken out of draft (ready_for_review, wired in `on:` above).
    if: >-
      github.repository == 'nmorabowen/OpenSees' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Restore prebuilt Conan deps (HDF5/TCL/…) so `conan install` is a cache
      # hit instead of rebuilding every dependency from source each run.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-
      # ccache caches compiled object files across runs: only changed TUs
      # recompile, turning the cold ~20-40 min build into a few minutes warm.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zone-a-${{ runner.os }}
          max-size: 2G
      - name: Install conan
        run: |
          pip install conan pytest pyyaml numpy sympy scipy  # sympy: hex20 oracle (ADR-72 P0); scipy: CMS oracle (ADR-1000)
          conan profile detect --force
      - name: Build OpenSees + OpenSeesPy
        run: |
          conan install . --build=missing
          cmake -S . -B build/Release -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cd build/Release
          cmake --build . --target OpenSees -j8
          cmake --build . --target OpenSeesPy -j8
          mv OpenSeesPy.so opensees.so
      - name: pytest Zone-A
        run: |
          cp build/Release/opensees.so tests/
          cd tests
          pytest -v -m "zone_a"
      # ADR-76 spin-off: a singular matrix must not report SUCCESS (LAPACK
      # `return -info+1`). Gate on the deck's terminal marker, NOT the exit code
      # — OpenSees exits 0 after a Tcl parse error (recorded quirk), so an exit-
      # code gate would pass on a deck that never ran.
      # TCL_LIBRARY: the CI binary aborts before registering ANY OpenSees command
      # without the conan Tcl runtime ("Can't find a usable init.tcl"). The G1
      # Tcl step below has been silently green through that exact failure since
      # its checker accepts "0 checks passed" — this step's marker gate is what
      # surfaced it (WORKFLOW_GOTCHAS). If find matches nothing, the deck dies,
      # the marker is absent, and this step goes red — honest either way.
      - name: LAPACK singular-matrix regression (ADR-76)
        run: |
          export TCL_LIBRARY="$(dirname "$(find ~/.conan2 -name init.tcl -path '*/tcl8.6/*' | head -1)")"
          build/Release/OpenSees Ladruno_implementation/lapack_singular_regression/lapack_singular_model.tcl 2>&1 | tee lapack_singular.log || true
          grep -q "LAPACK singular regression: all solvers reject the singular system" lapack_singular.log
      - name: Tcl verification suite + ladruno tcl (gated, G1)
        # Heavy suite: skip on iterative PR pushes (synchronize) so the dev loop
        # is just build + Zone-A pytest. Still runs on PR open/reopen/ready, on
        # push to ladruno, and on the nightly schedule.
        if: github.event.action != 'synchronize'
        # TCL_LIBRARY (WORKFLOW_GOTCHAS §7): without the conan Tcl runtime the
        # binary aborts init before registering any OpenSees command, every
        # sourced deck dies on its first command, and the suite driver's own
        # `open results.out w` leaves an EMPTY file — which the checker used to
        # bless as "OK (0 checks passed)". The checker now refuses an empty
        # result set, so this export is load-bearing, not cosmetic.
        run: |
          export TCL_LIBRARY="$(dirname "$(find ~/.conan2 -name init.tcl -path '*/tcl8.6/*' | head -1)")"
          BIN="$GITHUB_WORKSPACE/build/Release/OpenSees"
          cd EXAMPLES/verification
          "$BIN" runVerificationSuite.tcl || true
          "$BIN" "$GITHUB_WORKSPACE/tests/tcl/forceBeamColumn_cantilever.tcl" || true
          cd "$GITHUB_WORKSPACE"
          python ci/check_tcl_results.py

  # ---- Full suite in ONE process: cross-tier state leaks ----------------
  # The gap this closes, measured 2026-08-12:
  #
  #   PR CI    (ubuntu)      pytest -m "zone_a"
  #   nightly  (self-hosted) pytest -m "zone_b"
  #
  # The two tiers NEVER share a process, so a test in one tier that poisons a
  # process-global cannot be caught by either job. That is not hypothetical --
  # it is exactly how the ASDConcrete3D tag-keyed hardening-law cache defect
  # survived: a zone_a test registers material tag 1, and a zone_b test then
  # silently inherits its backbone. Measured both ways on the same build:
  # zone_b alone is 144 passed; zone_a-then-zone_b is 1 failed.
  #
  # So this job runs the WHOLE suite, unfiltered, in a single interpreter. It is
  # the only job that can see ordering and global-state effects at all.
  #
  # Separate job rather than a step of zone-b-nightly on purpose: a failure here
  # means "something leaks across tests", which is a different diagnosis from
  # "Zone-B is broken", and conflating them makes the check ambiguous.
  cross-tier-nightly:
    name: Full suite, one process (cross-tier leaks)
    if: >-
      github.repository == 'nmorabowen/OpenSees' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, windows, ladruno-perf]
    steps:
      - uses: actions/checkout@v4
      # ~50 min. The ONE deselect is the known, deliberately-unfixed
      # ASDConcrete3D defect (ADR-11 §KNOWN DEFECT, LEDGER_quirks,
      # Ladruno_files/testbed/asdconcrete_tag_cache/). Deselecting it here does
      # NOT hide it: the test still fails locally in a full run, which is the
      # documented expectation, and the sentinel step below fails this job the
      # moment the defect stops reproducing. Without the deselect this job would
      # be red every single night, which trains people to ignore it -- and a
      # permanently-red gate catches nothing.
      - name: Full suite, unfiltered, single process
        shell: pwsh
        run: |
          $env:APEGMSH_SKIP_VIEWER = "1"
          cd tests
          pytest -v --deselect test_ladrunoBrick_asdconcrete_bend.py::test_notched_bend_mesh_objectivity
      # Sentinel for the allowance above. Runs the minimal poisoning PAIR (~75 s)
      # and requires it to FAIL. If someone fixes the material, this goes green,
      # the step goes red, and whoever fixed it is told to delete the deselect
      # rather than leaving a stale exemption behind forever.
      # NB the pair is required: the bend test PASSES on its own (order-dependent),
      # so asserting on it alone would be meaningless.
      - name: Sentinel — the known ASDConcrete3D defect still reproduces
        shell: pwsh
        run: |
          cd tests
          pytest -q test_ladrunoBrick_asdconcrete.py::test_lch_handshake_mesh_objectivity test_ladrunoBrick_asdconcrete_bend.py::test_notched_bend_mesh_objectivity
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            Write-Host "::error::The ASDConcrete3D tag-cache defect no longer reproduces."
            Write-Host "::error::If it was fixed: delete the --deselect in the step above, drop this"
            Write-Host "::error::sentinel, and update ADR-11 + LEDGER_quirks + the testbed README."
            exit 1
          }
          Write-Host "Sentinel OK - the known defect still reproduces (pytest exit $rc), so the deselect above is still earned."
          exit 0

  # ---- Zone-B + perf: nightly, self-hosted oneAPI box -------------------
  # Also runs on manual workflow_dispatch so the self-hosted tier (Zone-B
  # cross-checks, perf, and the ADR-1000 CMS LADRUNO_CMS=ON build+checks) can be
  # validated ON DEMAND once the ladruno-perf runner is (re)registered — instead
  # of waiting for the 06:00 UTC cron. Needs the self-hosted runner online; when
  # it is offline the job queues and is cancelled (harmless, but no coverage).
  zone-b-nightly:
    name: Zone-B + perf (self-hosted)
    if: >-
      github.repository == 'nmorabowen/OpenSees' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, windows, ladruno-perf]
    steps:
      - uses: actions/checkout@v4
      - name: Zone-B (apeGmsh / LS-DYNA cross-checks)
        shell: pwsh
        run: |
          $env:APEGMSH_SKIP_VIEWER = "1"
          cd tests
          pytest -v -m "zone_b"
      - name: Perf micro-bench (state-determination ns/call)
        shell: pwsh
        run: python Ladruno_files/testbed/perf/runner.py --check
      # ADR-1000: the isolated OPS_LadrunoCMS library is OFF in the default
      # (Zone-A) build, so its ~6k-line core gets NO compile signal there. This
      # nightly step (self-hosted box has the oneAPI MPI+MUMPS toolchain the
      # Ubuntu Zone-A runner lacks) configures LADRUNO_CMS=ON, compiles the whole
      # library, and runs its standalone numerical checks under mpiexec -n 4.
      # Pattern-B opt-in-library coverage requirement — see BUILD_GOTCHAS.md #7.
      # build.bat with LADRUNO_CMS_BUILD=1 builds+runs ONLY the CMS checks and
      # exits (it does NOT build the full MP target — slow, and can hit an
      # unrelated MSVC ICE on ASDPlasticMaterial3D).
      - name: CMS opt-in library build + numerical checks (ADR-1000)
        shell: cmd
        env:
          LADRUNO_CMS_BUILD: "1"
        run: call Ladruno_scripts\build.bat OpenSeesMP
