# Ladruno fork CI — Zone-A gate. Does NOT run on upstream (guarded by repo name)
# so a PR back to OpenSees/OpenSees never drags this workflow along.
# Upstream build_cmake.yml stays untouched and keeps gating master.
name: Ladruno Zone-A

on:
  push:
    branches: [ladruno]
  pull_request:
    branches: [ladruno]
    # include ready_for_review so marking a draft "ready" re-triggers the build
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * *"   # nightly Zone-B / perf (self-hosted)
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same branch/PR, so
# rapid pushes don't queue 40-min builds behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- static gates: no build needed, fast, always run -------------------
  static-gates:
    name: classTag + manifest gates
    if: github.repository == 'nmorabowen/OpenSees'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: classTag collision + drift (Axis 1, G2)
        run: python ci/check_classtags.py
      - name: manifest ledger (G9)
        run: python ci/check_manifest.py

  # ---- Zone-A: build + pytest(zone_a) + gated Tcl suite ------------------
  zone-a-ubuntu:
    name: Zone-A (Ubuntu)
    # Skip the ~40-min Conan build on DRAFT PRs (drafts keep only the fast
    # static-gates). Still runs on push to ladruno, the nightly schedule, and
    # when a PR is taken out of draft (ready_for_review, wired in `on:` above).
    if: >-
      github.repository == 'nmorabowen/OpenSees' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Restore prebuilt Conan deps (HDF5/TCL/…) so `conan install` is a cache
      # hit instead of rebuilding every dependency from source each run.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-
      # ccache caches compiled object files across runs: only changed TUs
      # recompile, turning the cold ~20-40 min build into a few minutes warm.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zone-a-${{ runner.os }}
          max-size: 2G
      - name: Install conan
        run: |
          pip install conan pytest pyyaml
          conan profile detect --force
      - name: Build OpenSees + OpenSeesPy
        run: |
          conan install . --build=missing
          cmake -S . -B build/Release -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cd build/Release
          cmake --build . --target OpenSees -j8
          cmake --build . --target OpenSeesPy -j8
          mv OpenSeesPy.so opensees.so
      - name: pytest Zone-A
        run: |
          cp build/Release/opensees.so tests/
          cd tests
          pytest -v -m "zone_a"
      - name: Tcl verification suite + ladruno tcl (gated, G1)
        # Heavy suite: skip on iterative PR pushes (synchronize) so the dev loop
        # is just build + Zone-A pytest. Still runs on PR open/reopen/ready, on
        # push to ladruno, and on the nightly schedule.
        if: github.event.action != 'synchronize'
        run: |
          BIN="$GITHUB_WORKSPACE/build/Release/OpenSees"
          cd EXAMPLES/verification
          "$BIN" runVerificationSuite.tcl || true
          "$BIN" "$GITHUB_WORKSPACE/tests/tcl/forceBeamColumn_cantilever.tcl" || true
          cd "$GITHUB_WORKSPACE"
          python ci/check_tcl_results.py

  # ---- Zone-B + perf: nightly, self-hosted oneAPI box -------------------
  zone-b-nightly:
    name: Zone-B + perf (self-hosted)
    if: github.repository == 'nmorabowen/OpenSees' && github.event_name == 'schedule'
    runs-on: [self-hosted, windows, ladruno-perf]
    steps:
      - uses: actions/checkout@v4
      - name: Zone-B (apeGmsh / LS-DYNA cross-checks)
        shell: pwsh
        run: |
          $env:APEGMSH_SKIP_VIEWER = "1"
          cd tests
          pytest -v -m "zone_b"
      - name: Perf micro-bench (state-determination ns/call)
        shell: pwsh
        run: python Ladruno_files/testbed/perf/runner.py --check
