      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesUniaxialMaterialCommands.cpp
      - SRC/material/uniaxial/TclModelBuilderUniaxialMaterialCommand.cpp
      - SRC/material/uniaxial/CMakeLists.txt
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      Rebar-buckling WRAPPER UniaxialMaterial over any tension-compression
      bare-bar material (designed for LadrunoUniaxialJ2, composes over
      Steel02/Steel4). In compression past a slenderness-dependent onset it
      applies the Dhakal-Maekawa buckled-average degradation
      sigma_buckled = r(e,lambda)*sigma_bare (r in [resid,1], lambda=s/d),
      leaving the wrapped core byte-untouched -- a clean opt-in overlay,
      stackable Fatigue o RebarBuckling o J2. Tension + pre-onset pass through
      unchanged; -lsr 0 is the exact identity gate. Referenced to the
      tensile-unload anchor e_cross=eps_max-sigma_max/E (own minimal cyclic
      state: an eps_max anchor + cached onset backbone fStarL; NOT the
      ReinforcingSteel TBranchNum machine). Analytic consistent tangent
      dsigma/deps = r*k_bare + sigma_bare*(dr/deps) (improves on
      ReinforcingSteel's central-difference Buckled_mod_Dhakal). DM formula
      ported verbatim from ReinforcingSteel::Buckled_stress_Dhakal but in
      engineering strain on a generic wrapped bar (RS works in log strain);
      generic onset backbone via a committed-clone probe. Both laws (monotonic)
      shipped: -model dm + -model ga (Gomes-Appleton; knobs -reduction/-fsufrac,
      no -fy; hybrid analytic tangent). Deferred: DM cyclic re-straightening branch (B4). Plan/ADR:
      Ladruno_implementation/14_ladruno_rebar_buckling_adr.md.

  - feature: LadrunoBondSlip
    classtag: 33002          # MAT_TAG (uniaxial) family; after LadrunoUniaxialJ2=33000, LadrunoRebarBuckling=33001; per-registry band
    tag_symbol: MAT_TAG_LadrunoBondSlip
    pr: 168
    feature_class: material
    required_tiers: [T0m, T1]
    pytest: tests/test_ladrunoBondSlip_material.py   # backbone-vs-oracle (linear/power/plateau/softening/residual); D4.1 finite-k0 initial tangent; sign symmetry; D4.3 Gf-overrides-s3; elastic-k0 unload
    tcl: WAIVED(uniaxialMaterial LadrunoBondSlip ...; shared OpenSeesUniaxialMaterialCommands registry serves Tcl + Python, plus classic-Tcl TclModelBuilderUniaxialMaterialCommand dispatch; verified via the Zone-A pytest battery)
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesUniaxialMaterialCommands.cpp
      - SRC/material/uniaxial/TclModelBuilderUniaxialMaterialCommand.cpp
      - SRC/material/uniaxial/CMakeLists.txt
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      1D bond-slip tau-s UniaxialMaterial (CEB-FIP Model Code 2010 backbone) for
      the bar-axial slot of the embedded-rebar element (LadrunoEmbeddedRebar,
      ADR 20 / D4). v1 = MONOTONIC backbone + elastic (k0) unload/reload,
      sign-symmetric. Backbone with the D4 must-fix regularizations baked in:
      D4.1 linear s<s0 initial segment (kills the power-law dtau/ds->inf at s->0;
      s0 default 0.1*s1, k0 = tau_max*(s0/s1)^alpha/s0) -> ascending power law
      tau_max*(s/s1)^alpha -> plateau tau_max -> softening to tau_f (NEGATIVE
      tangent; D4.2 caller uses displacement/arc-length/IMPLEX control) ->
      residual tau_f. D4.3 -Gf overrides s3 so the softening triangle dissipates
      Gf per unit interface area (s3 = s2 + 2*Gf/(tau_max-tau_f)); the element
      scales tau by perimeter*L_trib. getInitialTangent = k0 (finite). First v2
      slice of the RC-3D plan; the embedded element (33005) consumes it. Plan/ADR:
      Ladruno_implementation/20_ladruno_embedded_reinforcement_adr.md.

  - feature: LadrunoEmbeddedRebar
    classtag: 33005          # ELE_TAG (element) family; after LadrunoBrick=33002, IMKBeam=33003, IMKBeam2d=33004
    tag_symbol: ELE_TAG_LadrunoEmbeddedRebar
    pr: 169
    feature_class: element
    required_tiers: [T0, T1]
    pytest: tests/test_ladrunoEmbeddedRebar_element.py   # perfect-bond axial spring (k*u); anisotropic transverse (kt not k); bond-slip axial follows tau(s); partition-of-unity force split to hosts by N_i + equilibrium; response probe
    tcl: WAIVED(element LadrunoEmbeddedRebar ...; shared OpenSeesElementCommands functionMap serves Tcl + Python; verified via the Zone-A pytest battery)
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesElementCommands.cpp
      - SRC/element/CMakeLists.txt
      - SRC/element/ladrunoEmbeddedRebar/CMakeLists.txt
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      Embedded-reinforcement COUPLING element (ADR 20, v2 slice 2): ties one rebar
      node to a host solid element's nodes via precomputed shape-function weights
      N_i, so a rebar mesh embeds in a NON-matching concrete mesh. Pure coupling
      (bond) -- the rebar's own axial stiffness lives on a separate corotTruss/beam
      along the bar. Gap g = u_rebar - sum_i N_i u_host_i; decomposed along the bar
      axis dir into axial slip s and transverse g_t; traction t = F_axial(s)*dir +
      kt*g_t with F_axial = perfect (kAxial*s) or bond (LadrunoBondSlip stress *
      bondScale, bondScale=perimeter*L_trib). Resisting force P = B^T t, tangent
      K = B^T D B, D = (dF/ds) dir(x)dir + kt (I - dir(x)dir) (anisotropic, D6).
      MODE P (penalty) -- implicit + explicit (adds stiffness only). MODE T
      (transformation/DOF-elim) DEFERRED: needs a multi-retained constraint the
      stock single-retained MP_Constraint cannot express. Host-agnostic (weights
      precomputed by the generator); rebar element type (truss|beam, D6) is the
      user's choice on the rebar mesh. Plan/ADR:
      Ladruno_implementation/20_ladruno_embedded_reinforcement_adr.md.

