    zone_b: []
    core_files: [SRC/classTags.h]
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      Band-remediated 26 -> 33000 (was above frontier VTKHDF=25). Not
      broker-registered (lower risk) but moved for per-family policy consistency.
      Zone-A check tests/test_energyBalanceRecorder.py authored (numpy, port of
