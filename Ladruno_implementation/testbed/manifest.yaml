      - SRC/material/uniaxial/CMakeLists.txt
      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      Uniaxial twin of LadrunoJ2 (UniaxialMaterial; fibers/truss/zeroLength).
      sigma=E(eps-eps^p), |sigma-X|-sig_y(pbar), Voce+linear isotropic (shared
      verbatim with the 3D class via SRC/material/nD/LadrunoHardening.h -- the
      oracle contract) + Chaboche superposed Armstrong-Frederick kinematic
      (X=sum_k X_k, N<=8; gamma_k=0 => linear Prager, saturation C_k/gamma_k).
      Return map = fixed direction s=sign(sigma_tr-X_n) (no M(dGamma) tensor
      solve like the 3D kernel) + scalar Newton on dpbar; analytic tangent
      E_alg=E h/(E+h). Real getInitialTangent=E (fixes the SimplifiedJ2 modal
      bug), no exit(). Oracle (V7): reduces to the 3D LadrunoJ2 under uniaxial
      stress to 1e-7 with identical (C_k,gamma_k,iso) -- pins the 3D Chaboche
      calibration. NOT a Steel02/Steel4 replacement: oracle + multi-AF ratcheting
      fiber + the core for the steel roadmap (fracture/LCF wrapper, local-buckling
      flag, weld/HAZ -- all deferred). Plan/ADR:
      Ladruno_implementation/13_ladruno_uniaxial_j2_adr.md (shipped via #95).

