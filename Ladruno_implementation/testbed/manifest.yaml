    status: active
    notes: >
      Finite-strain-native combined-hardening J2 (FiniteStrainNDMaterial subclass,
      setTrialF(F)) crossing the dSNPO 14.11 v2 boundary the v1 LogStrain-over-LadrunoJ2
      path cannot: owns the backstresses alpha_{n,k} as SPATIAL tensors and co-rotates
      them by R_Delta = polar(f_Delta) each step before the SHARED return map
      (LadrunoJ2Kernel.h, reused verbatim) so combined hardening is frame-indifferent
      under large rotation. Consistent tangent = analytic channel A (log-strain
      (1/2J)[D:L:B], LogStrainKernel.h) + numeric channel B (the backstress co-rotation
      d(alpha-tilde)/dF, ~1e-4..2e-3 rel, recovered exactly-to-FD by perturbing only R,
