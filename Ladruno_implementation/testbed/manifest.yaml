    classtag: 33001          # MAT_TAG (uniaxial) family; sibling of LadrunoUniaxialJ2=33000, per-registry band (no collision w/ ELE BezierTet10=33001)
    tag_symbol: MAT_TAG_LadrunoRebarBuckling
    pr: 119
    feature_class: material
    required_tiers: [T0m, T1]
    pytest: tests/test_ladrunoRebarBuckling_material.py   # DM: B0 -lsr 0 pass-through; B1 tension+pre-onset; B2/B2b DM formula vs ported reference; B3 slenderness trend + floor; B5 consistent-tangent FD. GA: GA0 -lsr 0 pass-through; GA1 tension gate; GA2 Gomes formula vs ported reference; GA3 reduction(=1 off,=0 full)+slenderness; GA5 consistent-tangent FD; B6 composition Fatigue.RebarBuckling.bar (rupture on buckled response); B7 sendSelf/recvSelf round-trip DM+GA via FE_Datastore
    tcl: WAIVED(uniaxialMaterial LadrunoRebarBuckling ...; shared OpenSeesUniaxialMaterialCommands registry serves Tcl + Python, plus classic-Tcl TclModelBuilderUniaxialMaterialCommand dispatch; verified via the Zone-A pytest battery)
    core_files:
