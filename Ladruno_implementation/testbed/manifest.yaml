  - feature: LadrunoJ2
    classtag: 33011          # ND_TAG family; combined iso + Chaboche AF kinematic von Mises J2
    tag_symbol: ND_TAG_LadrunoJ2
    pr: 87
    feature_class: material
    required_tiers: [T0m, T1]
    pytest: tests/test_ladrunoJ2_material.py   # elastic; reduce-to-J2Plasticity; monotonic kin==iso; Bauschinger; AF saturation; 3D mixed-shear reduce-to-J2Plasticity (6/6)
