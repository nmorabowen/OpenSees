    pr: 61
    feature_class: element
    required_tiers: [T0, T1]
    pytest: tests/test_bezierTet10_element.py    # T0 rank+patch+quadratic-completeness + T1 (green)
    tcl: WAIVED(no Tcl command surface yet — Python/apeGmsh-driven only)
    zone_b:
      - Ladruno_files/testbed/bezierTet10/        # apeGmsh tet10 order==D2' check (O11), deferred
    core_files:                                    # actually-touched upstream files
