# Ladruno test-bed manifest — the enforced per-feature ledger.
#
# ci/check_manifest.py diffs SRC/classTags.h against the base ref, extracts new
# ladruno #defines (those whose comment contains "Ladruno"), and asserts each
# has a row here AND a tests/test_<feature>.py — or an explicit tcl: WAIVED.
#
# Required fields per feature:
#   classtag   : int      the value in SRC/classTags.h (ladruno band >= 33000)
#   tag_symbol : str      the #define name, e.g. ELE_TAG_BezierTri6
#   pr         : int|null  PR number (null while in progress)
#   feature_class : material | element | integrator | derivative
#   required_tiers : list  the tiers the merge gate demands for this class
#   pytest     : str       path to the Zone-A pytest file (relative to repo root)
#   tcl        : str       path to the Zone-A tcl file, OR "WAIVED(<reason>)"
#   zone_b     : list|[]    Zone-B artifact paths (apeGmsh/LS-DYNA/perf)
#   core_files : list       upstream core files touched (must carry // LADRUNO:)
#   dispatch   : {tcl: bool, functionMap: bool}  both registries wired?
#   status     : active | remediation | planned

features:

  - feature: BezierTri6
    classtag: 33000          # moved 272 -> 33000 (ladruno band) 2026-05-30
    tag_symbol: ELE_TAG_BezierTri6
    pr: null
    feature_class: element
    required_tiers: [T0, T1, T2a]
    pytest: tests/test_bezierTri6_element.py     # T0 rank+patch+quadratic-completeness + T1 (green)
    tcl: WAIVED(no Tcl command surface yet — Python/apeGmsh-driven only)
    zone_b:
      - Ladruno_files/testbed/bezierTri6/         # apeGmsh curved-geometry T2b/T3
    core_files:                                    # actually-touched upstream files
      - SRC/classTags.h
      - SRC/interpreter/OpenSeesElementCommands.cpp
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      classTag band remediation DONE 2026-05-30 (272 -> 33000; 272 collided one
      above upstream PML3DVISCOUS=271 — the G2 example). Broker registration is
      N/A in this fork: FEM_ObjectBrokerAllClasses::getNewElement is a stub here
      (see Ladruno_implementation/04_bezier_elements.md), so no broker case is
      touched. Element-class gate COMPLETE + GREEN against dist/bin 2026-05-30
      (5 tests): T0 rank/zero-energy + constant-strain patch + quadratic-
      completeness (Bernstein control-net + b=-div sigma, GP-strain err ~1e-19);
      T1 uniaxial reaction + Poisson; T2a smooth-MMS convergence rate ~2.07
      (>1.8). NOTE: Cook's membrane was REJECTED for the rate gate — its clamped-
      corner singularity caps the displacement rate at ~1.3 (it is an accuracy
      benchmark, not a rate test); a smooth manufactured solution is used instead.

  - feature: BezierTet10
    classtag: 33001          # ladruno band; 3D sibling of BezierTri6=33000
    tag_symbol: ELE_TAG_BezierTet10
    pr: 61
    feature_class: element
    required_tiers: [T0, T1]
    pytest: tests/test_bezierTet10_element.py    # T0 rank+patch+quadratic-completeness + T1 (green)
    tcl: WAIVED(no Tcl command surface yet — Python/apeGmsh-driven only)
    zone_b:
      - Ladruno_files/testbed/bezierTet10/        # apeGmsh tet10 order==D2' check (O11), deferred
    core_files:                                    # actually-touched upstream files
      - SRC/classTags.h
      - SRC/interpreter/OpenSeesElementCommands.cpp
      - SRC/element/CMakeLists.txt
      - SRC/recorder/Ladruno_ElementResults.h
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      3D sibling of BezierTri6 (ADR 06_bezier_tet10, deferred under 04 D10).
      Broker registration N/A (getNewElement stub, as for BezierTri6). Element-
      class gate GREEN against dist/bin 2026-05-31 (4 tests): T0 rank/6 rigid-body
      modes + constant-strain patch (4-tet central-node) + quadratic completeness
      (3D Bernstein control-net blossom + b=-div sigma); T1 uniaxial reaction +
      Poisson (Kuhn 6-tet box). Recorder: one-block inverted-dispatch registration
      in Ladruno_ElementResults.h (Tetrahedron_10N + CustomIntegrationRule, dim=3);
      round-trip 14/14 (FAMILY=bernstein, bucket-as-group). T2a deferred: a curved
      convergence benchmark is geometry-limited for v1 straight-sided tets (Kadapa
      uses curved elements; see ADR O5/O11) — Python oracle 23/23 + §6.2 sphere
      convergence + locking study cover the formulation meanwhile.

  # --- pre-test-bed ladruno features: classTag band remediation (follow-up to
  #     BezierTri6). Tags moved into the >=33000 band, per-family, + Ladruno
  #     markers added so check_classtags tracks them. Zone-A tests are a known
  #     backlog item; current coverage is Zone-B Ladruno_scripts/_verify_explicit.py.
  #     ExplicitBathe + ExplicitDifferenceStatic are jaabell's tags. ---

  - feature: ExplicitBathe
    classtag: 33000          # INTEGRATOR family; was 61 (J.A. Abell)
    tag_symbol: INTEGRATOR_TAGS_ExplicitBathe
    pr: null
    feature_class: integrator
    required_tiers: [dynamics-battery]
    pytest: tests/test_explicitBathe_integrator.py    # Zone-A battery (order/stability/crosscheck/spectral/wave/rigid-body/dt_cr/lump/cflAbort)
    tcl: WAIVED(integrator; Zone-B _verify_explicit.py mirrors the Zone-A battery)
    zone_b: [Ladruno_scripts/_verify_explicit.py]
    core_files: [SRC/classTags.h]
    dispatch: {tcl: true, functionMap: true}
    status: active
    notes: >
      jaabell's tag. Band-remediated 61 -> 33000 (was one above frontier
      HarmonicSteadyState=60). Broker-dispatched (getNewTransientIntegrator,
      "must recvSelf") so collision risk was real. Zone-A battery
      tests/test_explicitBathe_integrator.py authored (numpy, 1:1 port of the
      pure-ExplicitBathe checks in _verify_explicit.py): order of accuracy ~2,
      stability beats CD's 2/omega, cross-check vs Newmark/CD, spectral
      damping/period vs Omega, 1-D wave speed, rigid-body momentum, queryable
      dt_cr + sub-step + -recompute, dt_cr<=0 no-value contract, -lump
      diagonal-vs-rowsum, -cflAbort enforcement. dt_cr machinery links on Linux
      via the CriticalTimeStep dsygvx_ swap (PR #28).

