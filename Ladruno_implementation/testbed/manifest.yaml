      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      Combined-hardening von Mises (J2): Voce+linear isotropic + Chaboche superposed
      Armstrong-Frederick kinematic (alpha=sum_k alpha_k, ships N<=8; gamma_k=0 => linear
      Prager, N=1 => single AF). Supersedes J2Plasticity (no kinematic) and SimplifiedJ2
      (linear-only + defects). Scalar Newton return map (Kobayashi-Ohno), analytic
      consistent tangent (dSNPO 7.213 + AF dn term) reducing term-by-term to J2Plasticity
      at N=0. (2/3)C_k numerator => standard Chaboche C_k,gamma_k. Re-landed in #87 after
      the impl was stranded on the docs-only merge of #82. Adversarial-review hardening:
      ||M||->0 guard (restored from J2Plasticity), stress-scaled tolerance. v1 3D only;
      tabulated iso / prager_nl oracle / PlaneStress / IMPL-EX deferred. Plan:
      Ladruno_implementation/10_ladruno_j2_plasticity.md.

