    classtag: 33011          # ND_TAG family; combined iso + Chaboche AF kinematic von Mises J2
    tag_symbol: ND_TAG_LadrunoJ2
    pr: 87
    feature_class: material
    required_tiers: [T0m, T1]
    pytest: tests/test_ladrunoJ2_material.py   # elastic; reduce-to-J2Plasticity; monotonic kin==iso; Bauschinger; AF saturation; 3D mixed-shear reduce-to-J2Plasticity (6/6)
    tcl: WAIVED(nDMaterial LadrunoJ2 ...; shared OpenSeesNDMaterialCommands registry serves Tcl + Python; verified via the Zone-A pytest battery)
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesNDMaterialCommands.cpp
      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      Combined-hardening von Mises (J2): Voce+linear isotropic + Chaboche superposed
      Armstrong-Frederick kinematic (alpha=sum_k alpha_k, ships N<=8; gamma_k=0 => linear
      Prager, N=1 => single AF). Supersedes J2Plasticity (no kinematic) and SimplifiedJ2
      (linear-only + defects). Scalar Newton return map (Kobayashi-Ohno), analytic
      consistent tangent (dSNPO 7.213 + AF dn term) reducing term-by-term to J2Plasticity
      at N=0. (2/3)C_k numerator => standard Chaboche C_k,gamma_k. Re-landed in #87 after
      the impl was stranded on the docs-only merge of #82. Adversarial-review hardening:
      ||M||->0 guard (restored from J2Plasticity), stress-scaled tolerance. v1 3D only;
      tabulated iso / prager_nl oracle / PlaneStress / IMPL-EX deferred. Plan:
      Ladruno_implementation/10_ladruno_j2_plasticity.md.

  - feature: LadrunoJ2Finite
    classtag: 33012          # ND_TAG family; finite-strain-native combined-hardening J2 (co-rotating backstress)
    tag_symbol: ND_TAG_LadrunoJ2Finite
    pr: 127
    feature_class: material
    required_tiers: [T0m, T1]
    pytest: tests/test_ladrunoJ2_finite_native_tangent.py   # channel-A+B tangent recipe exact-to-FD; channel-B small-but-present; channel-B objective (numpy oracle)
    tcl: WAIVED(nDMaterial LadrunoJ2Finite ...; shared OpenSeesNDMaterialCommands registry serves Tcl + Python; verified via the Zone-A pytest battery + element acceptance)
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesNDMaterialCommands.cpp
      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      Finite-strain-native combined-hardening J2 (FiniteStrainNDMaterial subclass,
      setTrialF(F)) crossing the dSNPO 14.11 v2 boundary the v1 LogStrain-over-LadrunoJ2
      path cannot: owns the backstresses alpha_{n,k} as SPATIAL tensors and co-rotates
      them by R_Delta = polar(f_Delta) each step before the SHARED return map
      (LadrunoJ2Kernel.h, reused verbatim) so combined hardening is frame-indifferent
      under large rotation. Consistent tangent = analytic channel A (log-strain
      (1/2J)[D:L:B], LogStrainKernel.h) + numeric channel B (the backstress co-rotation
      d(alpha-tilde)/dF, ~1e-4..2e-3 rel, recovered exactly-to-FD by perturbing only R,
      plastic steps only; mapped into cmat via Fdot=LF). Verified: numpy oracle objective
      ~1e-12 + tangent recipe exact-to-FD ~1e-14; g++ composition vs oracle 1e-9; element
      acceptance via LadrunoBrick -geom finite. IMPL-EX (-implex, Oliver-Huespe-Cante;
      PR #134): Delta-gamma extrapolation + co-rotated frozen flow direction =>
      constant SPD elastic reported tangent, implicit history committed (byte-identical);
      committed==implicit, explicit->implicit order~2, objective 7e-13 (oracles + g++ check
      + element acceptance). NON-goals v1: plane-stress finite (no consumer), tabulated iso.
      Plan: Ladruno_implementation/16_finite_native_j2_adr.md.

  - feature: InitDefGradNDMaterial
    classtag: 33013          # ND_TAG family; multiplicative staged-activation wrapper (after LadrunoJ2Finite=33012)
    tag_symbol: ND_TAG_InitDefGradNDMaterial
    pr: 163
    feature_class: material
    required_tiers: [T0m]
    pytest: tests/test_initDefGrad_material.py   # -noInitF==bare; explicit-F0 stress-free birth; post-birth rotation objectivity; reduce-to-relative; wrapped consistent-tangent==FD; two-phase staged construction (6/6)
    tcl: WAIVED(nDMaterial InitDefGrad $tag $innerTag; shared OpenSeesNDMaterialCommands registry serves Tcl + Python; verified via the Zone-A pytest battery through LadrunoBrick -geom finite)
    zone_b: []
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesNDMaterialCommands.cpp
      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      Multiplicative, finite-strain staged-activation wrapper -- the large-strain
      sibling of InitStrainNDMaterial. Makes a finite-strain continuum element born
      stress-free at the deformed geometry when appended mid-stage (staged
      construction). Wraps an inner FiniteStrainNDMaterial (e.g. LogStrain) and IS-A
      FiniteStrainNDMaterial, so LadrunoBrick -geom finite consumes it via its
      existing dynamic_cast with ZERO element edits. Captures the birth deformation
      gradient F0 (auto on the first setTrialF = birth, since addElement->setDomain->
      update evaluates at the committed deformed state) and forwards the relative
      gradient F_rel = F*F0^-1 (the split F = F_rel*F0). Objective where the additive
      InitStrain offset is not: under a post-birth rigid rotation F->Q*F, F_rel->Q*F_rel
      so C_rel is unchanged => zero spurious stress. The shipped spatial/Cauchy seam
      subsumes the PK1 J0/push-back bookkeeping (F_delta = F*F_n^-1 is invariant to F0;
      Cauchy stress is reference-independent). -noInitF pass-through; -F0 explicit birth;
      setResponse("F0") reports it. Small strain stays InitStrain (two materials, Init*
      family). Plan/ADR: Ladruno_implementation/staged_deformation_gradiend.md.

  - feature: StagedStrainNDMaterial
    classtag: 33014          # ND_TAG family; small-strain (2D+3D) staged-activation wrapper (after InitDefGrad=33013)
    tag_symbol: ND_TAG_StagedStrainNDMaterial
    pr: null
    feature_class: material
    required_tiers: [T0m]
    pytest: tests/test_stagedStrain_material.py   # 2D+3D: -noInit==bare; two-phase staged birth (quad+brick); dimensional sweep; reduce-to-relative; tangent==inner; J2 born-virgin; composition with InitStrain; graceful-fail; serialization
    tcl: WAIVED(nDMaterial StagedStrain $tag $innerTag; shared OpenSeesNDMaterialCommands registry serves Tcl + Python; verified via the Zone-A pytest battery through FourNodeQuad/stdBrick)
    zone_b: []
    core_files:
      - SRC/classTags.h
      - SRC/actor/objectBroker/FEM_ObjectBrokerAllClasses.cpp
      - SRC/interpreter/OpenSeesNDMaterialCommands.cpp
      - SRC/material/nD/CMakeLists.txt
    dispatch: {tcl: false, functionMap: true}
    status: active
    notes: >
      Small-strain, dimension-general (2D+3D), AUTO-CAPTURING staged-activation wrapper
      -- the small-strain sibling of InitDefGrad (StagedDefGrad). Makes a small-strain
      continuum element (FourNodeQuad, stdBrick, plane-strain/stress, axisymmetric)
      born stress-free at the deformed geometry when appended mid-stage. Fixes the
      three ways the upstream InitStrain bites staged use: (1) InitStrain is 3D-only
      (getOrder hardcoded 6) and exit(-1)s on a non-3D inner -- StagedStrain is order-
      general (eps0 sized to inner->getOrder(); getCopy(type) adapts the inner view)
      and fails gracefully; (2) InitStrain's eps0 is fixed -- StagedStrain auto-captures
      eps0 on the first setTrialStrain (= birth), so one tag births a whole lift, each
      copy snapshotting its own birth strain; (3) InitStrain ADDS a prestrain --
      StagedStrain SUBTRACTS the captured birth strain (eps_rel = eps - eps0) for
      stress-free birth. Born GENUINELY virgin (zero stress AND zero plastic history);
      tangent is an exact passthrough (eps0 constant => no FD gate). Additive => exact
      for small strain only (finite uses StagedDefGrad/InitDefGrad). COMPOSES with the
      upstream InitStrain for staged-birth-plus-prestrain by nesting StagedStrain
      OUTERMOST: element -> StagedStrain(InitStrain(real, eps_pre)) => born carrying
      sigma(eps_pre). -noInit pass-through; -eps0 explicit birth strain; setResponse
      "eps0"/"totalStrain". Also registers the StagedDefGrad alias for InitDefGrad so
      the Staged* family reads coherently. Plan/ADR:
      Ladruno_implementation/staged_deformation_gradiend.md.

