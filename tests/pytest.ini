[pytest]
# Ladruno test-bed marker registry. See Ladruno_implementation/testbed/00_canonical_testbed.md
markers =
    zone_a: upstreamable — OpenSees/OpenSeesPy only, travels with the PR, gates CI
    zone_b: fork-local — apeGmsh / gmsh / LS-DYNA / perf, nightly self-hosted only
    t0: single-element rank / patch / rigid-body battery
    t0m: material-point driver (stress path + tangent finite-difference)
    t1: closed-form analytical check (isclose rel_tol 1e-9)
    t2a: fixed-mesh benchmark deck (Cook, MacNeal-Harder, PinchedCylinder)
    t2b: apeGmsh convergence sweep (observed rate > 1.8)
    t3: cross-code / complex-geometry validation (apeGmsh drive, LS-DYNA oracle)
